[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-axis-engine"
version = "1.0.0"
description = "Deterministic, bounded prime-axis route planning engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prime-axis-engine = "prime_axis_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
